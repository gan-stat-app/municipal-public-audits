name: Collect Tohoku item-7 official records
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 15 * *' # 06:17 JST on the 16th, unchanged
  push:
    branches: [main]
    paths: ['workloads/tohoku.py']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python workloads/tohoku.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-tohoku-${{ github.run_id }}
          path: |
            reports/tohoku.json
            collections/tohoku/
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: collect
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.collect.result != 'cancelled'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: workloads/publish.py
          sparse-checkout-cone-mode: false
      - name: Publish only normalized public data and hash receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python workloads/publish.py
