name: Public data validation and site build
on:
  push:
    branches: [main]
    paths: ['snapshot/**', 'workloads/inputs.json', 'workloads/common.py', 'workloads/site.py', 'workloads/opendata.py', '.github/workflows/public-workloads.yml']
  pull_request:
    paths: ['snapshot/**', 'workloads/inputs.json', 'workloads/common.py', 'workloads/site.py', 'workloads/opendata.py', '.github/workflows/public-workloads.yml']
  workflow_dispatch:
    inputs:
      opendata_limit:
        description: '0 = all published originals; bounded initial rollout uses 12'
        default: '12'
        type: string
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 JST, before the private 04:00 regression
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      opendata_required: ${{ steps.changes.outputs.opendata_required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 openpyxl==3.1.5
      - run: python -m unittest discover -s workloads -p 'test_*.py'
      - run: python snapshot/source/machine-readability/test_pipeline.py
      - run: python snapshot/source/food-business/test_model.py
      - id: changes
        name: Keep successful scoring when only site execution changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os,subprocess
          required=True
          if os.environ['GITHUB_EVENT_NAME']=='push':
              try:
                  paths=subprocess.check_output(['git','diff','--name-only',os.environ['BEFORE'],os.environ['GITHUB_SHA']],text=True).splitlines()
                  common={'workloads/inputs.json','workloads/common.py','workloads/opendata.py','.github/workflows/public-workloads.yml'}
                  required=not paths or any(p in common or p.startswith('snapshot/source/machine-readability/') for p in paths)
              except (KeyError,subprocess.CalledProcessError):
                  pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('opendata_required='+str(required).lower()+'\n')
          PY
  site-build-and-ui:
    needs: security-and-contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install Japanese font
        run: |
          font_file="$RUNNER_TEMP/NotoSansCJKjp-Regular.otf"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 --output "$font_file" https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          printf '%s  %s\n' 68a3fc98800b2a27b371f2fb79991daf3633bd89309d4ffaa6946fd587f375b5 "$font_file" | sha256sum --check --strict
          install -Dm644 "$font_file" "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
      - name: Build locked source and run existing desktop and mobile checks
        run: python workloads/site.py
      - name: Retain public app build and exact-input receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-site-build
          path: |
            reports/site.json
            app-build/
            snapshot/source/article-index-review/*.png
            snapshot/source/map-display-review/*.png
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true # Only the generated app-build/.vite manifest
  opendata-current-originals:
    needs: security-and-contract
    if: github.event_name != 'pull_request' && needs.security-and-contract.outputs.opendata_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 openpyxl==3.1.5 pydantic==2.14.0
      - name: Re-evaluate original files without AI or public diagnostic text
        env:
          FILE_LIMIT: ${{ inputs.opendata_limit || '12' }}
        run: python workloads/opendata.py --limit "$FILE_LIMIT"
      - name: Retain numeric and hash receipt only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-opendata-receipt
          path: reports/opendata.json
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: [security-and-contract, site-build-and-ui]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: workloads/publish.py
          sparse-checkout-cone-mode: false
      - name: Publish reviewed public outputs without cross-repository credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python workloads/publish.py
