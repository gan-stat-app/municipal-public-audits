name: Public-source API review
on:
  workflow_dispatch:
    inputs:
      mode:
        description: One approved document request, or the existing key probe
        type: choice
        options: [document-once, key-check]
        default: document-once
  push:
    branches: [main]
    paths: ['api_review/queue.json']
  pull_request:
    paths: ['api_review/**', '.github/workflows/public-api-review.yml']
  schedule:
    - cron: '7 */6 * * *'
permissions:
  contents: read
concurrency:
  group: public-api-review
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.2 PyYAML==6.0.3
      - run: python -m unittest discover -s api_review -p 'test_*.py'
  execute:
    needs: test
    if: (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'document-once')) && github.ref == 'refs/heads/main' && vars.PUBLIC_API_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.2
      - name: Drain approved public excerpts; checkpoint public candidates
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_RESULT_KEY: ${{ secrets.API_RESULT_KEY }}
          PUBLIC_RUN_MODE: ${{ inputs.mode }}
        run: python api_review/worker.py
  key-check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'key-check' && github.ref == 'refs/heads/main' && vars.PUBLIC_API_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.2
      - name: Check existing key once without draining document queue
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_RESULT_KEY: ${{ secrets.API_RESULT_KEY }}
        run: python api_review/key_check.py

