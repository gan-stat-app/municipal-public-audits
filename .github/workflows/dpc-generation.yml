name: DPC public aggregate generation
on:
  push:
    branches: [main]
    paths: ['workloads/dpc_generation.py', 'workloads/test_dpc_generation.py', 'workloads/dpc-generation-inputs.json', 'workloads/common.py', 'dpc-snapshot/scripts/*dpc-area-mdc-summary.mjs', 'stage2/**', '.github/workflows/dpc-generation.yml']
  pull_request:
    paths: ['workloads/dpc_generation.py', 'workloads/test_dpc_generation.py', 'workloads/dpc-generation-inputs.json', 'workloads/common.py', 'dpc-snapshot/scripts/*dpc-area-mdc-summary.mjs', 'stage2/**', '.github/workflows/dpc-generation.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: 'Run only the selected accepted unit'
        type: choice
        options: [mdc, definitions, aggregate]
        default: mdc
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      aggregate: ${{ steps.select.outputs.aggregate }}
      definitions: ${{ steps.select.outputs.definitions }}
      mdc: ${{ steps.select.outputs.mdc }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          SELECTED: ${{ inputs.scope }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PYCODE'
          import os, subprocess
          paths = [] if os.environ['EVENT'] == 'workflow_dispatch' else subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BASE'], os.environ['HEAD']], text=True).splitlines()
          groups = {
              'aggregate': lambda p: p.startswith('dpc-snapshot/scripts/') or p in {'workloads/dpc_generation.py', 'workloads/test_dpc_generation.py', 'workloads/dpc-generation-inputs.json', 'workloads/common.py'},
              'definitions': lambda p: p in {'stage2/definitions.py', 'stage2/run.py', 'stage2/test_stage2.py', 'workloads/common.py'},
              'mdc': lambda p: p in {'stage2/reference/build-dpc-data.py', 'stage2/mdc.py', 'stage2/run_mdc.py', 'stage2/test_mdc.py', 'stage2/mdc-local-receipt.json', 'stage2/inventory.json', 'workloads/common.py'},
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name, affected in groups.items():
                  selected = os.environ['SELECTED'] == name if os.environ['EVENT'] == 'workflow_dispatch' else any(map(affected, paths))
                  print(f'{name}={str(selected).lower()}', file=out)
          PYCODE
  generate:
    needs: scope
    if: needs.scope.outputs.aggregate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: |
            workloads/common.py
            workloads/dpc_generation.py
            workloads/test_dpc_generation.py
            workloads/dpc-generation-inputs.json
            dpc-snapshot/scripts/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: python -m unittest discover -s workloads -p 'test_dpc_generation.py'
      - name: Rebuild and compare published DPC aggregate
        run: python workloads/dpc_generation.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dpc-generation
          path: dpc-generation-output/
          retention-days: 1
          if-no-files-found: error

  definitions-from-official-excel:
    needs: scope
    if: needs.scope.outputs.definitions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 et-xmlfile==2.0.0
      - run: python -m unittest discover -s stage2 -p 'test_stage2.py'
      - name: Rebuild 2024 surgery definitions from official Excel
        run: python stage2/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dpc-official-definitions
          path: dpc-stage2-output/
          retention-days: 1
          if-no-files-found: error

  mdc-from-official-excel:
    needs: scope
    if: needs.scope.outputs.mdc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 et-xmlfile==2.0.0
      - run: python -m unittest discover -s stage2 -p 'test_mdc.py'
      - name: Verify official MDC source, original dictionary identity and output hash
        run: python stage2/run_mdc.py
      # run_mdc uses TemporaryDirectory; neither workbook nor intermediate is uploaded.
