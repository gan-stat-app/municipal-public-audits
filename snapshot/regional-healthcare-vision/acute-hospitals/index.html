<section class="source-note"><h2>掲載範囲と病床数の読み方</h2>
<p>基準日は各厚生局の名簿によって異なります。病床数は備考欄にある区分別の届出病床数です。複数の病棟種別・届出区分がある病院は明細を分け、病院数は医療機関番号で重複を除いています。空欄は「未確認」と表示します。</p>
<p>特定機能病院入院基本料など、別の入院基本料を届け出た病棟は対象外です。</p>
